<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f3ef">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://khanhbes.github.io/projects/violation-detect/">
  <title>Đang chuyển tới VNeTraffic…</title>
  <script>
    const destination = new URL("https://khanhbes.github.io/projects/violation-detect/");
    destination.hash = window.location.hash;
    window.location.replace(destination.toString());
  </script>
</head>
<body>
  <p>Đang chuyển tới <a id="destination" href="https://khanhbes.github.io/projects/violation-detect/">trang tổng hợp VNeTraffic</a>…</p>
  <script>
    document.querySelector("#destination").href = `https://khanhbes.github.io/projects/violation-detect/${window.location.hash}`;
  </script>
</body>
</html>
